on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 去掉了还没正式发布的 3.15，保留稳定的
        python-version: ["3.11", "3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i ${{ matrix.python-version }}
          sccache: "true"
      - name: Install Just
        uses: extractions/setup-just@v3
      - name: Run Cargo Tests
        run: |
          cargo test
      - name: Run pytest
        run: |
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          .venv/bin/pip install wheel pytest mkdocs-material
          maturin develop
          .venv/bin/pytest

  # 保留 Linux x64 构建，Termux 属于 Linux
  linux:
    runs-on: ubuntu-latest
    needs: lint_and_test
    strategy:
      matrix:
        target: [x64, aarch64] # Termux 在 arm 设备上一般用 aarch64
        interpreter: ["3.11", "3.12", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.interpreter }}
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.interpreter }}
          path: dist

  # ⚠️ 把原本庞大的 musllinux、windows、macos 任务全删了，节省大量时间

  # ⚠️ 删除了会导致报错的 sdist 任务

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    # ⚠️ 依赖项里去掉了 sdist 和不需要的平台
    needs: [linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing *